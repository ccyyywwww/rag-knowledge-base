<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 知识库问答系统</title>
    <style>
        /* ===== 页面整体 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f4f6f9;
            color: #2c3e50;
            min-height: 100vh;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 24px 16px; }

        /* ===== 顶部标题 ===== */
        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 24px; color: #1a1a2e; }
        header p { font-size: 14px; color: #888; margin-top: 6px; }

        /* ===== 卡片通用样式 ===== */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: #1a1a2e; }

        /* ===== 上传区 ===== */
        .upload-row { display: flex; gap: 10px; align-items: center; }
        input[type="file"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px dashed #b0b8c8;
            border-radius: 8px;
            font-size: 14px;
            background: #fafbfc;
        }
        button {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #uploadStatus { margin-top: 10px; font-size: 13px; color: #666; }

        /* ===== 聊天区 ===== */
        #chatBox {
            height: 360px;
            overflow-y: auto;
            padding: 12px;
            background: #fafbfc;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;   /* 保留回答里的换行 */
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            align-self: flex-start;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }
        .msg.error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
        .msg.loading { color: #888; font-style: italic; }

        .chat-row { display: flex; gap: 10px; }
        .chat-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        .chat-row input:focus { outline: none; border-color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 PDF 知识库问答系统</h1>
            <p>上传文档 → 构建知识库 → 提问，AI 基于文档内容回答</p>
        </header>

        <!-- ===== 上传区 ===== -->
        <div class="card">
            <h2>第一步：上传文档</h2>
            <div class="upload-row">
                <input type="file" id="fileInput" accept=".pdf,.txt">
                <button id="uploadBtn" onclick="uploadFile()">上传并建库</button>
            </div>
            <div id="uploadStatus">支持 PDF 和 TXT 文件</div>
        </div>

        <!-- ===== 聊天区 ===== -->
        <div class="card">
            <h2>第二步：提问</h2>
            <div id="chatBox">
                <div class="msg ai">请先上传文档，然后在这里提问。我会从文档中检索相关内容来回答。</div>
            </div>
            <div class="chat-row">
                <input type="text" id="questionInput" placeholder="输入你的问题，按回车发送"
                       onkeydown="if(event.key==='Enter')sendQuestion()">
                <button onclick="sendQuestion()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 上传逻辑 =====
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            const btn = document.getElementById('uploadBtn');

            const file = fileInput.files[0];
            if (!file) { status.textContent = '请先选择文件'; return; }

            // 上传期间禁用按钮，防止重复点击
            btn.disabled = true;
            status.textContent = `正在上传并建库：${file.name} ...`;

            // FormData 专门用来传文件。append('file', ...) 的 'file'
            // 必须和后端 UploadFile 参数名一致（app.py 里是 file）
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) {
                    status.textContent = '❌ ' + (data.detail || '上传失败');
                } else {
                    status.textContent = '✅ ' + data.message;
                }
            } catch (err) {
                status.textContent = '❌ 网络错误：' + err;
            } finally {
                btn.disabled = false;
            }
        }

        // ===== 聊天逻辑 =====
        function addMessage(role, text) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;  // 自动滚到底部
            return div;  // 返回这个元素，方便后面更新内容
        }

        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            addMessage('user', question);
            input.value = '';

            // 先显示"思考中"，拿到回答后替换它
            const loadingEl = addMessage('ai', '思考中...');

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const data = await res.json();
                if (!res.ok) {
                    loadingEl.className = 'msg error';
                    loadingEl.textContent = '❌ ' + (data.detail || '提问失败');
                } else {
                    loadingEl.textContent = data.answer;
                }
            } catch (err) {
                loadingEl.className = 'msg error';
                loadingEl.textContent = '❌ 网络错误：' + err;
            }
        }
    </script>
</body>
</html>
