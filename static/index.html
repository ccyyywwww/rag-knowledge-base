<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 知识库问答系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f4f6f9;
            color: #2c3e50;
            min-height: 100vh;
            transition: margin-left 0.3s;
        }
        body.sidebar-open { margin-left: 280px; }
        .container { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
        header { text-align: center; margin-bottom: 24px; position: relative; }
        header h1 { font-size: 24px; color: #1a1a2e; }
        header p { font-size: 14px; color: #888; margin-top: 6px; }
        .file-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
        }
        .file-btn:hover { background: #1d4ed8; }
        /* 侧边栏 */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            transition: left 0.3s;
            padding: 20px;
            overflow-y: auto;
            z-index: 999;
        }
        .sidebar.open { left: 0; }
        .sidebar h2 { font-size: 18px; margin-bottom: 16px; color: #1a1a2e; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        .sidebar li:hover { background: #f0f4ff; }
        .sidebar li.selected {
            background: #dbeafe;
            border-left: 3px solid #2563eb;
        }
        .sidebar li input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .sidebar li .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;   /* 提示可点击打开 */
        }
        .sidebar li .file-name:hover {
            color: #2563eb;
        }
        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            padding: 24px;
            border-radius: 12px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal .close {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .modal h3 { margin-bottom: 12px; }
        .modal pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #fafbfc;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: #1a1a2e; }
        .upload-row { display: flex; gap: 10px; align-items: center; }
        input[type="file"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px dashed #b0b8c8;
            border-radius: 8px;
            font-size: 14px;
            background: #fafbfc;
        }
        button {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #uploadStatus { margin-top: 10px; font-size: 13px; color: #666; }
        #chatBox {
            height: 360px;
            overflow-y: auto;
            padding: 12px;
            background: #fafbfc;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            align-self: flex-start;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
            width: 100%;
        }
        .msg.error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
        .msg.loading { color: #888; font-style: italic; }
        .sources {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #ddd;
            font-size: 13px;
            color: #555;
        }
        .sources summary { cursor: pointer; color: #2563eb; font-weight: 500; }
        .sources p {
            background: #f9fafb;
            padding: 6px 10px;
            border-radius: 4px;
            margin: 4px 0;
            border-left: 3px solid #2563eb;
        }
        .chat-row { display: flex; gap: 10px; }
        .chat-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        .chat-row input:focus { outline: none; border-color: #2563eb; }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <h2>📁 已上传文件</h2>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
            <label style="font-size:14px; display:flex; align-items:center; gap:4px; cursor:pointer;">
                <input type="checkbox" id="selectAll" onchange="toggleAll(this.checked)"> 全选
            </label>
            <button id="deleteBtn" onclick="deleteSelected()" style="background:#ef4444; padding:4px 12px; font-size:13px;">🗑 删除所选</button>
        </div>
        <ul id="fileList" style="list-style:none; padding:0;"></ul>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close" onclick="closeModal()">×</button>
            <h3 id="modalTitle">文件内容</h3>
            <pre id="modalContent">加载中...</pre>
        </div>
    </div>

    <!-- 主界面 -->
    <button class="file-btn" onclick="toggleSidebar()">📁 文件列表</button>

    <div class="container">
        <header>
            <h1>📚 PDF 知识库问答系统</h1>
            <p>上传文档 → 构建知识库 → 提问，AI 基于文档内容回答</p>
        </header>

        <div class="card">
            <h2>第一步：上传文档</h2>
            <div class="upload-row">
                <input type="file" id="fileInput" accept=".pdf,.txt" multiple>
                <button id="uploadBtn" onclick="uploadFile()">上传并建库</button>
            </div>
            <div id="uploadStatus">支持 PDF 和 TXT 文件</div>
        </div>

        <div class="card">
            <h2>第二步：提问</h2>
            <div id="chatBox">
                <div class="msg ai">请先上传文档，然后在这里提问。我会从文档中检索相关内容来回答。</div>
            </div>
            <div class="chat-row">
                <input type="text" id="questionInput" placeholder="输入你的问题，按回车发送"
                       onkeydown="if(event.key==='Enter')sendQuestion()">
                <button onclick="sendQuestion()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 侧边栏控制 =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.body.classList.toggle('sidebar-open');
        }

        // ===== 加载文件列表 =====
        async function loadFileList() {
            try {
                const res = await fetch('/files');
                const data = await res.json();
                const list = document.getElementById('fileList');
                list.innerHTML = '';
                if (data.files.length === 0) {
                    list.innerHTML = '<li style="color:#888; cursor:default; justify-content:center;">暂无文件</li>';
                    return;
                }
                data.files.forEach(f => {
                    const li = document.createElement('li');
                    li.dataset.hash = f.hash;

                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = 'file-check';
                    cb.onchange = (e) => {
                        e.stopPropagation();
                        li.classList.toggle('selected', cb.checked);
                        updateSelectAllState();
                    };

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'file-name';
                    nameSpan.textContent = f.name;

                    li.appendChild(cb);
                    li.appendChild(nameSpan);

                    // ★ 点击事件：点击文件名 → 打开文件；点击其他区域 → 切换选中
                    li.addEventListener('click', (e) => {
                        // 如果点击的是 checkbox，不处理（已在 change 中处理）
                        if (e.target.tagName === 'INPUT') return;
                        // 如果点击的是文件名区域，打开文件（不切换选中）
                        if (e.target.classList.contains('file-name')) {
                            openFile(li.dataset.hash, e.target.textContent);
                            return;
                        }
                        // 否则切换选中状态
                        cb.checked = !cb.checked;
                        li.classList.toggle('selected', cb.checked);
                        updateSelectAllState();
                    });

                    list.appendChild(li);
                });
                // 重置全选状态
                document.getElementById('selectAll').checked = false;
            } catch (e) {
                console.error('加载文件列表失败', e);
            }
        }

        // ===== 全选/取消全选 =====
        function toggleAll(checked) {
            document.querySelectorAll('#fileList .file-check').forEach(cb => {
                cb.checked = checked;
                cb.closest('li').classList.toggle('selected', checked);
            });
        }

        // ===== 更新全选复选框状态 =====
        function updateSelectAllState() {
            const cbs = document.querySelectorAll('#fileList .file-check');
            const checked = document.querySelectorAll('#fileList .file-check:checked');
            const selectAll = document.getElementById('selectAll');
            if (cbs.length === 0) {
                selectAll.checked = false;
                selectAll.indeterminate = false;
                return;
            }
            if (checked.length === cbs.length) {
                selectAll.checked = true;
                selectAll.indeterminate = false;
            } else if (checked.length === 0) {
                selectAll.checked = false;
                selectAll.indeterminate = false;
            } else {
                selectAll.checked = false;
                selectAll.indeterminate = true;
            }
        }

        // ===== 删除所选 =====
        async function deleteSelected() {
            const cbs = document.querySelectorAll('#fileList .file-check:checked');
            if (cbs.length === 0) {
                alert('请先选择要删除的文件');
                return;
            }
            if (!confirm(`确定要删除 ${cbs.length} 个文件吗？此操作不可恢复。`)) return;

            const hashes = Array.from(cbs).map(cb => cb.closest('li').dataset.hash);
            try {
                const res = await fetch('/files', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hashes })
                });
                const data = await res.json();
                if (!res.ok) {
                    alert('删除失败：' + (data.detail || '未知错误'));
                } else {
                    alert(`成功删除 ${data.deleted} 个文件`);
                    loadFileList(); // 刷新列表
                }
            } catch (err) {
                alert('网络错误：' + err);
            }
        }

        // ===== 打开文件内容（模态框） =====
        async function openFile(hash, name) {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').textContent = name;
            document.getElementById('modalContent').textContent = '加载中...';
            overlay.classList.add('active');
            try {
                const res = await fetch(`/file/${hash}`);
                const data = await res.json();
                document.getElementById('modalContent').textContent = data.content || '(空内容)';
            } catch (e) {
                document.getElementById('modalContent').textContent = '加载失败';
            }
        }
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
        // 点击背景关闭
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ===== 上传逻辑 =====
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            const btn = document.getElementById('uploadBtn');
            if (fileInput.files.length === 0) {
                status.textContent = '请先选择文件';
                return;
            }
            btn.disabled = true;
            status.textContent = `正在上传并建库 ${fileInput.files.length} 个文件...`;
            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }
            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) {
                    status.textContent = '❌ ' + (data.detail || '上传失败');
                } else {
                    status.textContent = '✅ ' + data.message;
                    loadFileList(); // 刷新侧边栏
                }
            } catch (err) {
                status.textContent = '❌ 网络错误：' + err;
            } finally {
                btn.disabled = false;
            }
        }

        // ===== 聊天逻辑 =====
        function addMessage(role, text, sources = null) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            if (role === 'ai') {
                let content = text;
                if (sources && sources.length > 0) {
                    let srcHtml = '<details class="sources"><summary>📖 参考了 ' + sources.length + ' 段资料</summary>';
                    sources.forEach((s, idx) => {
                        srcHtml += `<p>${idx+1}. ${s}</p>`;
                    });
                    srcHtml += '</details>';
                    content = text + srcHtml;
                }
                div.innerHTML = content;
            } else {
                div.textContent = text;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;
            addMessage('user', question);
            input.value = '';
            const loadingEl = addMessage('ai', '思考中...');
            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const data = await res.json();
                if (!res.ok) {
                    loadingEl.className = 'msg error';
                    loadingEl.textContent = '❌ ' + (data.detail || '提问失败');
                } else {
                    const answer = data.answer || '';
                    const sources = data.sources || [];
                    loadingEl.className = 'msg ai';
                    let content = answer;
                    if (sources.length > 0) {
                        let srcHtml = '<details class="sources"><summary>📖 参考了 ' + sources.length + ' 段资料</summary>';
                        sources.forEach((s, idx) => {
                            srcHtml += `<p>${idx+1}. ${s}</p>`;
                        });
                        srcHtml += '</details>';
                        content = answer + srcHtml;
                    }
                    loadingEl.innerHTML = content;
                }
            } catch (err) {
                loadingEl.className = 'msg error';
                loadingEl.textContent = '❌ 网络错误：' + err;
            }
        }
    </script>
</body>
</html>
